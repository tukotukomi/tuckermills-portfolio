<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betty Lou's Farm Hop</title>
<!-- Farm Hop now lives at farmhop.fun. Each website keeps its own saves, so the farm
     saved here goes along in the link; farmhop.fun only takes it if it has no farm yet. -->
<link rel="canonical" href="https://farmhop.fun/">
<script>
(function () {
  var farm = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (/^bl-[\w-]+$/.test(k)) farm[k] = localStorage.getItem(k);
    }
  } catch (e) {}
  var move = Object.keys(farm).length ? '#move=' + encodeURIComponent(JSON.stringify(farm)) : '';
  location.replace('https://farmhop.fun/' + location.search + move);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://farmhop.fun/"></noscript>
</head>
<body style="font-family: system-ui, sans-serif; text-align: center; padding: 40px 16px; background: #9bd85a; color: #3a2442;">
<p>Betty Lou's Farm Hop has moved to <a href="https://farmhop.fun/">farmhop.fun</a>.</p>
</body>
</html>
