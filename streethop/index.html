<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Betty Lou's Street Hop</title>
<meta name="description" content="Help Betty Lou hop across farm roads, pastures and creeks without getting flattened by a tractor or charged by a bull.">
<meta name="theme-color" content="#2f6e3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Street Hop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="left">
    <div id="score" class="outline">0</div>
    <div id="top" class="outline">TOP 0</div>
  </div>
  <div id="coins" class="outline"><svg class="flower" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#000" stroke-width="1.4" stroke-linejoin="round"><path d="M12 1.5l2.6 4.2 4.8-1.2-1.2 4.8 4.3 2.7-4.3 2.7 1.2 4.8-4.8-1.2L12 22.5l-2.6-4.2-4.8 1.2 1.2-4.8L1.5 12l4.3-2.7-1.2-4.8 4.8 1.2z" fill="#ffcc1a"/><circle cx="12" cy="12" r="4.4" fill="#7a4a1c"/></g></svg><span id="coinN">0</span></div>
</div>

<div id="title">
  <div class="logo">
    <div class="l1 outline">Betty Lou's</div>
    <div class="l2"><span>S</span><span>T</span><span>R</span><span>E</span><span>E</span><span>T</span></div>
    <div class="l2 l3"><span>H</span><span>O</span><span>P</span><span>!</span></div>
  </div>
</div>

<div id="hint" class="outline">Tap to hop<small>Swipe to turn &amp; go back</small></div>

<div id="over">
  <div id="overMsg" class="outline"></div>
  <div id="newTop" class="outline">New top score!</div>
  <button id="play" aria-label="Play again">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>
</div>

<button id="look" aria-label="Switch art style">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 1 0 0 19c1.4 0 2-1 1.6-2.1-.5-1.3.3-2.6 1.8-2.6H18a3.5 3.5 0 0 0 3.5-3.5c0-5-4.3-10.8-9.5-10.8z" fill="#fff" stroke="#000" stroke-width="1.5"/><circle cx="7.5" cy="11" r="1.6" fill="#ff4b4b" stroke="#000"/><circle cx="10" cy="6.8" r="1.6" fill="#ffd93b" stroke="#000"/><circle cx="15" cy="6.8" r="1.6" fill="#46a6ff" stroke="#000"/><circle cx="17.6" cy="10.6" r="1.6" fill="#5fd35f" stroke="#000"/></svg>
</button>
<button id="sound" aria-label="Toggle sound">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"/><path class="x" d="M16 9l5 6M21 9l-5 6" stroke="#000" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="game.js"></script>
</body>
</html>
